name: Autopost (manual trigger)

# Manual-only — дёргает production Vercel /api/cron/autopost.
# Используется для немедленной публикации поста из очереди.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping autopost
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -eu
          code=$(curl -sS --max-time 240 -o /tmp/body.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://amy-threads-bot.vercel.app/api/cron/autopost")
          echo "HTTP ${code}"
          cat /tmp/body.txt
          test "${code}" = "200"
